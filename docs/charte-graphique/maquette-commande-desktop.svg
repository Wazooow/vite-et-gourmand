<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" font-family="Arial, sans-serif">
  <rect width="1280" height="800" fill="#ffffff"/>
  <rect x="0" y="0" width="1280" height="64" fill="#6b3fa0"/>
  <text x="30" y="40" font-size="20" fill="#ffffff" font-weight="bold">Vite &amp; Gourmand</text>

  <text x="30" y="110" font-size="24" fill="#33234a" font-weight="bold">Commander « Menu Pâques Champêtre »</text>
  <text x="30" y="135" font-size="13" fill="#666">4 personnes minimum — 38,00 €/pers.</text>

  <!-- Formulaire -->
  <text x="30" y="175" font-size="12" fill="#333">Adresse de livraison</text>
  <rect x="30" y="182" width="500" height="30" rx="4" fill="#ffffff" stroke="#ccc"/>
  <text x="30" y="230" font-size="12" fill="#333">Ville</text>
  <rect x="30" y="237" width="240" height="30" rx="4" fill="#ffffff" stroke="#ccc"/>
  <text x="290" y="230" font-size="12" fill="#333">Code postal</text>
  <rect x="290" y="237" width="240" height="30" rx="4" fill="#ffffff" stroke="#ccc"/>
  <text x="30" y="285" font-size="12" fill="#333">Date de la prestation</text>
  <rect x="30" y="292" width="240" height="30" rx="4" fill="#ffffff" stroke="#ccc"/>
  <text x="290" y="285" font-size="12" fill="#333">Nombre de personnes</text>
  <rect x="290" y="292" width="240" height="30" rx="4" fill="#ffffff" stroke="#ccc"/>

  <!-- Recap -->
  <rect x="600" y="170" width="450" height="190" rx="8" fill="#f7f5fa"/>
  <text x="625" y="200" font-size="13" fill="#333">Prix du menu : <tspan font-weight="bold">307,80 €</tspan></text>
  <text x="625" y="225" font-size="11" fill="#6b3fa0">Réduction de 10% appliquée</text>
  <text x="625" y="255" font-size="13" fill="#333">Frais de livraison : <tspan font-weight="bold">0,00 €</tspan></text>
  <text x="625" y="295" font-size="16" fill="#33234a" font-weight="bold">Total : 307,80 €</text>

  <rect x="30" y="350" width="220" height="42" rx="4" fill="#6b3fa0"/>
  <text x="140" y="376" text-anchor="middle" font-size="14" fill="#ffffff">Valider la commande</text>

  <rect x="0" y="740" width="1280" height="60" fill="#222222"/>
  <text x="20" y="20" font-size="12" fill="#999" font-weight="bold">MAQUETTE — Formulaire de commande (desktop, 1280px)</text>
</svg>
