<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 900" font-family="Arial, sans-serif">
  <rect width="375" height="900" fill="#ffffff"/>
  <rect x="0" y="0" width="375" height="56" fill="#6b3fa0"/>
  <text x="16" y="34" font-size="15" fill="#ffffff" font-weight="bold">Vite &amp; Gourmand</text>

  <text x="16" y="95" font-size="20" fill="#33234a" font-weight="bold">Nos menus</text>

  <!-- Filtres empiles -->
  <rect x="16" y="115" width="343" height="150" rx="6" fill="#f7f5fa"/>
  <rect x="30" y="130" width="315" height="28" rx="4" fill="#ffffff" stroke="#ccc"/>
  <text x="38" y="147" font-size="10" fill="#777">Prix min / max</text>
  <rect x="30" y="168" width="315" height="28" rx="4" fill="#ffffff" stroke="#ccc"/>
  <text x="38" y="185" font-size="10" fill="#777">Thème</text>
  <rect x="30" y="206" width="315" height="28" rx="4" fill="#ffffff" stroke="#ccc"/>
  <text x="38" y="223" font-size="10" fill="#777">Régime / Personnes</text>

  <!-- Cartes empilees -->
  <g>
    <rect x="16" y="290" width="343" height="230" rx="8" fill="#ffffff" stroke="#eeeeee"/>
    <rect x="16" y="290" width="343" height="110" fill="#7a1f2b"/>
    <text x="187" y="350" text-anchor="middle" font-size="12" fill="#ffffff">Menu de Noël</text>
    <text x="32" y="425" font-size="13" fill="#33234a" font-weight="bold">Menu de Noël Traditionnel</text>
    <text x="32" y="443" font-size="10" fill="#6b3fa0">Noel · Classique</text>
    <text x="32" y="465" font-size="11" fill="#444">6 pers. min — 45,00 €/pers.</text>
    <rect x="32" y="480" width="130" height="30" rx="4" fill="#6b3fa0"/>
    <text x="97" y="500" text-anchor="middle" font-size="11" fill="#fff">Voir le menu</text>
  </g>
  <g>
    <rect x="16" y="540" width="343" height="230" rx="8" fill="#ffffff" stroke="#eeeeee"/>
    <rect x="16" y="540" width="343" height="110" fill="#3f7a4e"/>
    <text x="187" y="600" text-anchor="middle" font-size="12" fill="#ffffff">Menu Pâques</text>
    <text x="32" y="675" font-size="13" fill="#33234a" font-weight="bold">Menu Pâques Champêtre</text>
    <text x="32" y="693" font-size="10" fill="#6b3fa0">Paques · Classique</text>
    <text x="32" y="715" font-size="11" fill="#444">4 pers. min — 38,00 €/pers.</text>
    <rect x="32" y="730" width="130" height="30" rx="4" fill="#6b3fa0"/>
    <text x="97" y="750" text-anchor="middle" font-size="11" fill="#fff">Voir le menu</text>
  </g>

  <rect x="0" y="830" width="375" height="70" fill="#222222"/>
  <text x="8" y="16" font-size="10" fill="#999" font-weight="bold">MAQUETTE — Liste des menus (mobile, 375px)</text>
